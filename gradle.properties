# Gradle (memory and build optimizations)
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment versions
# Latest versions: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version and the NeoForge version must match each other.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.251
neo_version_range=[21,)
loader_version_range=[4,)

## Mod metadata
# mod_id must match the @Mod constant in the main mod class.
mod_id=monster_conquest
mod_name=Monster Conquest
mod_license=All rights reserved (see LICENSE): redistribution/modification allowed with credit, no commercial use
mod_version=1.0.0
mod_group_id=com.ohhapple
mod_authors=ohhapple
mod_description=recruit soldiers, build armies, command them in formation or RTS mode.
