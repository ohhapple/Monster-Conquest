# Mod metadata template. Placeholders are filled in from gradle.properties during the build.
modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
displayURL = "https://github.com/ohhapple"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "monster_conquest_icon.png"
authors = "${mod_authors}"
description = '''${mod_description}'''

# [[mixins]]
# config = "${mod_id}.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
