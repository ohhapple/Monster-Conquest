plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

def resolveBuildBranch = {
    String branch = providers.gradleProperty("gitBranch").orNull?.trim()
    if (branch == null) {
        branch = providers.environmentVariable("GITHUB_HEAD_REF").orNull?.trim()
    }
    if (branch == null
            && providers.environmentVariable("GITHUB_REF_TYPE").orNull == "branch") {
        branch = providers.environmentVariable("GITHUB_REF_NAME").orNull?.trim()
    }
    if (branch == null) {
        branch = providers.exec {
            commandLine "git", "branch", "--show-current"
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
    }
    if (!branch || branch == "HEAD") {
        return "unknown"
    }
    return branch
}
def buildGitBranch = resolveBuildBranch()
def buildArchiveName = providers.gradleProperty("build_name")
        .orNull?.trim()
if (!buildArchiveName) {
    throw new GradleException("build_name must not be blank")
}
if (buildArchiveName.find {
    it in ['/', '\\', ':', '*', '?', '"', '<', '>', '|']
            || Character.isWhitespace(it.charAt(0))
}) {
    throw new GradleException(
            "build_name contains a character that is not safe in an archive name: ${buildArchiveName}")
}

repositories {
    mavenLocal()
}

base {
    archivesName = buildArchiveName
}

// JAR 文件名只用于区分构建目标；加载器和 Minecraft 版本仍以 mods.toml 为准。
tasks.named('jar', Jar) {
    archiveFileName.set(
            "${buildArchiveName}-${mod_loader}-mc${minecraft_version}-${mod_version}.jar")
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // GameTest 服务端：跑完全部测试后自动退出
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // 开发运行用 INFO：DEBUG 会把 Mixin / 注册表的调试输出全灌进 run/logs，
            //   排查问题时按需临时改回 DEBUG 即可。
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// NeoFormRuntime 每次运行会留下带时间戳的空临时目录。只清理空目录，
// 运行中或仍有文件的目录会保留，避免影响正在执行的开发任务。
def pruneNeoFormTemp = tasks.register("pruneNeoFormTemp") {
    group = "build"
    description = "Removes empty NeoFormRuntime temporary directories."
    def neoFormTemp = layout.buildDirectory.dir("tmp/neoformruntime")
    doLast {
        def root = neoFormTemp.get().asFile
        if (!root.isDirectory()) return
        def purgeEmpty
        purgeEmpty = { File dir ->
            dir.listFiles()?.each { child ->
                if (child.isDirectory()) purgeEmpty(child)
            }
            if (dir.listFiles()?.length == 0) dir.delete()
        }
        purgeEmpty(root)
    }
}

tasks.matching {
    it.name in ["runClient", "runServer", "gameTestServer",
                "createMinecraftArtifacts", "downloadAssets", "build"]
}.configureEach {
    finalizedBy(pruneNeoFormTemp)
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// LICENSE 随 jar 一起分发（放在 jar 根目录，解包即可看到）
tasks.named('processResources', ProcessResources) {
    from(rootProject.file('LICENSE'))
}


dependencies {
}

// 把 gradle.properties 里的占位属性展开进 mods.toml 模板
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             git_branch             : buildGitBranch,
                             mod_loader             : mod_loader,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// 发布配置（仅产出本地文件，不推送到远程仓库）
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
